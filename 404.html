<style>
/* ═══ PAGE INTROUVABLE (404) ═══
   Même matière que le site : fond noir, texte porcelaine, gris cendre pour
   la ligne d'explication, bouton en pilule bleue. Rien d'autre : une page
   d'erreur doit se lire en une seconde et rendre la main. */
:root{
  --panneau:#000000; --porcelaine:#F5F5F7; --cendre:#86868B;
  --bleu-a:#1F4CEE; --bleu-b:#2E6BEE; --bleu-c:#4899EC;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  min-height:100svh; background:var(--panneau); color:var(--porcelaine);
  font-family:Inter,system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:clamp(28px,6vw,64px) 24px;
  /* La même lumière douce que derrière l'appareil du premier écran. */
  background-image:radial-gradient(60% 45% at 50% 42%, rgba(46,107,238,.16), transparent 70%);
}
.marque{display:inline-flex; align-items:center; gap:10px; margin-bottom:clamp(30px,5vh,56px); text-decoration:none}
.marque img{height:34px; width:auto; display:block}
.logotype{font-family:Poppins,Inter,sans-serif; font-weight:500; font-size:24px;
          letter-spacing:-.044em; color:#FFFFFF; line-height:1}
.code{
  margin:0 0 clamp(10px,1.6vh,18px);
  font-weight:600; font-size:clamp(13px,1.2vw,15px); letter-spacing:-.01em;
  color:var(--cendre);
}
h1{
  margin:0; font-weight:560; letter-spacing:-.028em; line-height:1.06;
  font-size:clamp(34px,5.2vw,72px); color:var(--porcelaine); text-wrap:balance;
}
p.dit{
  margin:clamp(14px,2vh,22px) auto 0; max-width:44ch;
  font-weight:400; font-size:clamp(16px,1.35vw,19px); line-height:1.5;
  letter-spacing:-.012em; color:var(--cendre); text-wrap:pretty;
}
.actes{display:flex; flex-wrap:wrap; gap:11px; justify-content:center; margin-top:clamp(28px,4.5vh,44px)}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  padding:15px 26px; border-radius:100px; border:none; cursor:pointer;
  font-family:inherit; font-weight:600; font-size:max(14.5px,.755vw); letter-spacing:-.012em;
  text-decoration:none; white-space:nowrap; color:#FFFFFF;
  background:linear-gradient(135deg,var(--bleu-a) 0%,var(--bleu-b) 62%,var(--bleu-c) 100%);
  box-shadow:0 6px 16px rgba(31,76,238,.24);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.btn:hover{transform:translateY(-1px)}
.btn.verre{
  background:rgba(66,66,69,.72); box-shadow:none;
  -webkit-backdrop-filter:blur(22px) saturate(170%); backdrop-filter:blur(22px) saturate(170%);
}
.btn.verre:hover{background:rgba(88,88,92,.78)}
.btn:focus-visible{outline:2px solid #4899EC; outline-offset:3px}
.liens{margin-top:clamp(26px,4vh,40px); font-size:15px; letter-spacing:-.012em; color:var(--cendre)}
.liens a{color:#2997FF; text-decoration:none}
.liens a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
