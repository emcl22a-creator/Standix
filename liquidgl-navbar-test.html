  const sync = (inst, c) => {
    if (!inst || !inst.options) return;
    Object.assign(inst.options, engineOpts(c));
    // API officielle d'instance (lignes 3535 et 3545 du moteur)
    if (typeof inst.setTilt === 'function' && inst.options.tilt !== c.tilt) {
      inst.setTilt(c.tilt);
    }
    if (typeof inst.setShadow === 'function' && inst.options.shadow !== c.shadow) {
      inst.setShadow(c.shadow);
    }
    if (typeof inst.updateMetrics === 'function') inst.updateMetrics();
  };
  sync(barLens, BAR);
  sync(lensLens, LENS);
  applyBlur(document.getElementById('navBlur'), BAR);
  applyBlur(lensEl, LENS);
  applyLensCss();
}

function applyLensMotion() {
  applyLensCss();
  if (!lensLens || !lensLens.options) return;
  const k = motionK;
  const mix = (a, b) => a + (b - a) * k;
  const o = lensLens.options;
  o.refraction = mix(LENS.refraction, MOTION.refraction);
  o.magnify    = mix(LENS.magnify,    MOTION.magnify);
  o.frost      = mix(LENS.frost,      MOTION.frost);
  o.bevelDepth = mix(LENS.bevelDepth, MOTION.bevelDepth);
  o.aberration = mix(LENS.aberration, MOTION.aberration);
}

function applyGeom() {
  lensEl.style.width = geom.w + 'px';
  lensEl.style.height = geom.h + 'px';
  lensEl.style.borderRadius = geom.r + 'px';
  lensEl.style.marginLeft = (geom.x - BAR_W / 2 - geom.w / 2) + 'px';
  lensEl.style.marginTop = (-geom.h / 2) + 'px';
}

function goTo(i) {
  if (i === activeTab && !anim) return;
  anim = { from: geom.x, to: TAB_CENTERS[i], t0: performance.now() };
  activeTab = i;
  console.log('TRAVEL START');
}

function tick() {
  if (anim) {
    const k = cl((performance.now() - anim.t0) / TRAVEL_MS);
    geom.x = anim.from + (anim.to - anim.from) * sm(k);
    geom.w = REST_W * widthAt(k);
    geom.h = heightAt(k);
    geom.r = Math.min(geom.w, geom.h) / 2;

    // Cloche : 0 au depart, 1 au milieu, 0 a l'arrivee.
    // A l'arret motionK vaut 0 : aucun zoom, aucun effet.
    motionK = Math.pow(Math.sin(k * Math.PI), MOTION.curve);

    if (k >= 1) {
      geom.x = anim.to;
      geom.w = REST_W;
      geom.h = REST_H;
      geom.r = Math.min(REST_W, REST_H) / 2;
      anim = null;
      motionK = 0;
      console.log('TRAVEL END');
    }
    render();
    applyGeom();
    applyLensMotion();
  }
  requestAnimationFrame(tick);
}

/* ============================================================
   liquidGL : navbar et lentille, MEME materiau, DEUX objets
   ============================================================ */
/* ============================================================
   REGLAGES — deux jeux totalement independants.
   BAR  = la grande navbar
   LENS = le cercle qui contient l'icone et le texte
   ============================================================ */
/* Options OFFICIELLES de liquidGL (defaults, ligne 4052 du moteur).
   Aucune couche CSS n'est ajoutee a la barre : ce sont les vrais
   parametres du projet, appliques en temps reel via instance.options. */
const BAR = {
  // Valeurs de la DEMO OFFICIELLE (index.html du depot, ligne 1012)
  resolution:  2,
  reveal:      'fade',
  refraction:  0.026,
  aberration:  0,
  bevelDepth:  0.119,
  bevelWidth:  0.057,
  frost:       0,
  magnify:     1,
  specular:    true,
  shadow:      true,
  tilt:        false,
  tiltFactor:  10,
  tiltEase:    400,
};


/* Options OFFICIELLES de liquidGL, identiques a celles de la barre.
   Deux instances distinctes, deux jeux de valeurs independants. */
const LENS = {
  resolution:  2,
  reveal:      'fade',
  refraction:  0.026,
  aberration:  0,
  bevelDepth:  0.119,
  bevelWidth:  0.057,
  frost:       0,
  magnify:     1.2,
  specular:    true,
  shadow:      false,
  tilt:        false,
  tiltFactor:  10,
  tiltEase:    400,
};


let barLens = null;
let lensLens = null;

const toLiquidGL = (c) => ({
  snapshot: 'body',
  resolution: c.resolution,
  refraction: c.refraction,
  aberration: c.aberration,
  bevelDepth: c.bevelDepth,
  bevelWidth: c.bevelWidth,
  frost: c.frost,
  specular: c.specular,
  shadow: c.shadow,
  magnify: c.magnify,
  tilt: c.tilt,
  tiltFactor: c.tiltFactor,
  tiltEase: c.tiltEase,
  reveal: c.reveal,
});



/* ============================================================
   Panneau de reglages : BAR, CERCLE, ICONES, TEXTE — separes
   ============================================================ */
/* Presets officiels du README de liquidGL */
const PRESETS = {
  Default: { refraction: 0,     bevelDepth: 0.052, bevelWidth: 0.211, frost: 2,   shadow: true,  specular: true  },
  Alien:   { refraction: 0.073, bevelDepth: 0.2,   bevelWidth: 0.156, frost: 2,   shadow: true,  specular: false },
  Pulse:   { refraction: 0.03,  bevelDepth: 0,     bevelWidth: 0.273, frost: 0,   shadow: false, specular: false },
  Frost:   { refraction: 0,     bevelDepth: 0.035, bevelWidth: 0.119, frost: 0.9, shadow: true,  specular: true  },
  Edge:    { refraction: 0.047, bevelDepth: 0.136, bevelWidth: 0.076, frost: 2,   shadow: true,  specular: false },
};

const CTRL = [
  ['GRANDE BARRE — liquidGL', BAR, [
    ['refraction','refraction',0,0.2,0.002],
    ['aberration','aberration',0,1,0.01],
    ['bevelDepth','bevelDepth',0,0.5,0.005],
    ['bevelWidth','bevelWidth',0.02,0.6,0.005],
    ['frost','frost',0,4,0.05],
    ['magnify','magnify',1,2,0.01],
    ['resolution','resolution',0.5,3,0.1],
    ['tiltFactor','tiltFactor',0,20,0.5],
    ['tiltEase','tiltEase',50,1200,10],
    ['cssBlur','Flou CSS (px)',0,20,0.5],
  ], ['specular','shadow','tilt','revealFade'], 'BAR'],
  ['CERCLE ACTIF — liquidGL', LENS, [
    ['refraction','refraction',0,0.2,0.002],
    ['aberration','aberration',0,1,0.01],
    ['bevelDepth','bevelDepth',0,0.5,0.005],
    ['bevelWidth','bevelWidth',0.02,0.6,0.005],
    ['frost','frost',0,4,0.05],
    ['magnify','magnify',1,2,0.01],
    ['resolution','resolution',0.5,3,0.1],
    ['tiltFactor','tiltFactor',0,20,0.5],
    ['tiltEase','tiltEase',50,1200,10],
    ['cssBlur','Flou CSS (px)',0,20,0.5],
  ], ['specular','shadow','tilt','revealFade','useLiquidGL'], 'LENS'],
  ['EFFETS PENDANT LE TRAJET', MOTION, [
    ['iconZoom','Zoom icones',1,2.5,0.01],
    ['labelZoom','Zoom texte',1,2.5,0.01],
    ['refraction','refraction au pic',0,0.2,0.002],
    ['magnify','magnify au pic',1,2.5,0.01],
    ['frost','frost au pic',0,4,0.05],
    ['bevelDepth','bevelDepth au pic',0,0.5,0.005],
    ['aberration','aberration au pic',0,1,0.01],
    ['curve','Courbe du pic',0.3,3,0.05],
  ], []],
  ['ICONES', ICON, [
    ['size','Taille (px)',10,40,0.5],
    ['strokeWidth','Epaisseur trait',0.5,4,0.1],
  ], []],
  ['ESPACEMENT', LAYOUT, [
    ['gap','Icone / texte (px)',0,20,0.5],
  ], []],
  ['TEXTE', LABEL, [
    ['size','Taille (px)',5,20,0.5],
    ['weight','Graisse',300,800,100],
  ], []],
  ['GEOMETRIE', GEO, [
    ['restW','Largeur repos',30,120,1],
    ['restH','Hauteur repos',20,80,1],
    ['movingW','Largeur trajet',0.4,1,0.01],
    ['overflow','Hauteur ajoutee',0,30,0.5],
    ['travelMs','Duree (ms)',150,1500,10],
  ], []],
];

function buildPanel() {
  const p = document.getElementById('panel');
  p.innerHTML = CTRL.map(([title, obj, sliders, toggles, presetFor], gi) =>
    `<h4>${title}</h4>` +
    (presetFor
      ? `<div class="row" style="flex-wrap:wrap;gap:4px">` +
        Object.keys(PRESETS).map(n =>
          `<button data-preset="${n}" data-for="${gi}"
            style="flex:1;min-width:44px;padding:3px 0;font-size:9.5px;cursor:pointer;
                   background:rgba(139,140,240,.18);color:#dcdcff;
                   border:1px solid rgba(139,140,240,.4);border-radius:5px">${n}</button>`
        ).join('') + `</div>`
      : '') +
    sliders.map(([k, lab, mn, mx, st], si) =>
      `<div class="row"><label>${lab}</label>
       <input type="range" data-g="${gi}" data-k="${k}" min="${mn}" max="${mx}" step="${st}" value="${obj[k]}">
       <b id="v${gi}_${si}">${obj[k]}</b></div>`).join('') +
    toggles.map(k => {
      const isReveal = k === 'revealFade';
      const checked = isReveal ? obj.reveal === 'fade' : obj[k];
      return `<div class="row"><label>${isReveal ? 'reveal (fade)' : k}</label>
       <input type="checkbox" data-g="${gi}" data-k="${k}" ${checked ? 'checked' : ''}></div>`;
    }).join('')
  ).join('') + `<div class="hint">Tous les reglages liquidGL sont ceux du depot. frost est un rayon de flou en px. Les effets de trajet ne sont visibles que pendant un changement de page.</div>`;

  p.addEventListener('click', e => {
    const btn = e.target.closest('button[data-preset]');
    if (!btn) return;
    Object.assign(CTRL[+btn.dataset.for][1], PRESETS[btn.dataset.preset]);
    buildPanel();
    applyAll();
  });

  p.addEventListener('input', e => {
    const el = e.target;
    const gi = +el.dataset.g, k = el.dataset.k;
    if (!k) return;
    const obj = CTRL[gi][1];
    if (k === 'revealFade') obj.reveal = el.checked ? 'fade' : 'none';
    else obj[k] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
    const b = el.parentElement.querySelector('b');
    if (b) b.textContent = obj[k];
    applyAll();
  });
}

function applyAll() {
  applyEngines();
  applyLensMotion();
  REST_W = GEO.restW; REST_H = GEO.restH;
  MOVING_W = GEO.movingW; OVERFLOW = GEO.overflow; TRAVEL_MS = GEO.travelMs;
  if (!anim) { geom.w = REST_W; geom.h = REST_H; geom.r = Math.min(REST_W, REST_H) / 2; }
  render();
  applyGeom();
}

function start() {
  buildPanel();
  render();
  applyGeom();
  // Deux geometries independantes, un seul jeu de parametres.
  barLens = liquidGL({
    ...toLiquidGL(BAR),
    target: '#navbar',
    on: { init: (l) => console.log('liquidGL bar ready', l.options) },
  });
  if (LENS.useLiquidGL) {
    lensLens = liquidGL({
      ...toLiquidGL(LENS),
      target: '#lens',
      on: { init: (l) => console.log('liquidGL lens ready', l.options) },
    });
  }

  // API officielle : les elements qui bougent ou changent doivent etre
  // declares pour que le moteur reactualise son snapshot (ligne 4132).
  if (typeof liquidGL.registerDynamic === 'function') {
    liquidGL.registerDynamic(['#tabs', '#lens']);
  }
  tabsEl.addEventListener('click', e => {
    const t = e.target.closest('.tab');
    if (t) goTo(+t.dataset.i);
  });
  requestAnimationFrame(tick);
}

// Le snapshot doit etre pris une fois l'image du decor chargee.
document.addEventListener('DOMContentLoaded', () => {
  const img = document.getElementById('bgimg');
  if (img && !img.complete) img.onload = start;
  else start();
});
})();
</script>
